name: PHPCS workflow tests

on:
  push:
    branches: [master, main, 'v*-branch']
  pull_request:

permissions:
  contents: read

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install PyYAML==6.0.3
      - run: python .github/workflows/tests/phpcs-workflow.py

  # Exercise the real isolated install and standards discovery, not just stubs.
  smoke-test:
    name: PHPCS smoke test (PHP ${{ matrix.php-version }}, ${{ matrix.standard || 'auto' }})
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.4']
        standard: ['', '.github/workflows/tests/fixtures/phpcs/ruleset.xml']
    uses: ./.github/workflows/phpcs.yml
    with:
      php-version: ${{ matrix.php-version }}
      standard: ${{ matrix.standard }}
      path: .github/workflows/tests/fixtures/phpcs/clean.php
